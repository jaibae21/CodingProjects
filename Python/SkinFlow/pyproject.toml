[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skinflow"
version = "0.1.0"
description = "Local-first skincare inventory and routine planner for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
skinflow = "skinflow.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skinflow = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
